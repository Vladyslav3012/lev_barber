name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# Serialize production publish+deploy on main/master; never cancel an in-flight prod run.
# PR branches still cancel superseded runs.
concurrency:
  group: ${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && 'production-deploy' || format('ci-{0}', github.ref) }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout@v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      # actions/setup-node@v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      - name: Build
        env:
          NEXT_PUBLIC_SITE_URL: https://example.com
        run: npm run build

  docker:
    name: Docker build (no push)
    runs-on: ubuntu-latest
    steps:
      # actions/checkout@v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      # docker/setup-buildx-action@v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      # docker/build-push-action@v6 — catch broken Dockerfiles on PRs before main deploy
      - name: Build frontend image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          target: prod
          push: false
          load: false
          build-args: |
            NEXT_PUBLIC_SITE_URL=https://example.com

      - name: Build nginx image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: ./nginx
          push: false
          load: false

  publish:
    name: Publish images to GHCR
    needs: [frontend, docker]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: read
      packages: write
    outputs:
      frontend_digest: ${{ steps.frontend_image.outputs.digest }}
      nginx_digest: ${{ steps.nginx_image.outputs.digest }}
      image_owner: ${{ steps.meta.outputs.owner }}
    steps:
      # actions/checkout@v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Image namespace (lowercase)
        id: meta
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      # docker/setup-buildx-action@v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      # docker/login-action@v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Require NEXT_PUBLIC_SITE_URL
        env:
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL != '' && vars.NEXT_PUBLIC_SITE_URL || secrets.NEXT_PUBLIC_SITE_URL }}
        run: |
          if [ -z "${NEXT_PUBLIC_SITE_URL}" ]; then
            echo "Set repository variable or secret NEXT_PUBLIC_SITE_URL (public HTTPS origin, no trailing slash)." >&2
            exit 1
          fi

      # docker/build-push-action@v6
      - name: Build and push frontend
        id: frontend_image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          target: prod
          push: true
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL != '' && vars.NEXT_PUBLIC_SITE_URL || secrets.NEXT_PUBLIC_SITE_URL }}
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/barber-frontend:sha-${{ github.sha }}
            ghcr.io/${{ steps.meta.outputs.owner }}/barber-frontend:main
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      # docker/build-push-action@v6
      - name: Build and push nginx
        id: nginx_image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: ./nginx
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/barber-nginx:sha-${{ github.sha }}
            ghcr.io/${{ steps.meta.outputs.owner }}/barber-nginx:main
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

  deploy:
    name: Deploy production
    needs: [publish]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    steps:
      # actions/checkout@v4 — compose + deploy script for the same commit as published images
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup SSH key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          if [ -z "${DEPLOY_SSH_KNOWN_HOSTS}" ]; then
            echo "DEPLOY_SSH_KNOWN_HOSTS secret is required (pinned host key; do not use ssh-keyscan in CI)" >&2
            exit 1
          fi
          if grep -q 'BEGIN.*PRIVATE KEY' <<< "$DEPLOY_SSH_KEY"; then
            echo "$DEPLOY_SSH_KEY" | sed 's/\r$//' > ~/.ssh/deploy_key
          else
            echo "$DEPLOY_SSH_KEY" | base64 -d > ~/.ssh/deploy_key
          fi
          chmod 600 ~/.ssh/deploy_key
          ssh-keygen -lf ~/.ssh/deploy_key
          # Pin host key from a verified secret — never trust a runtime ssh-keyscan alone.
          printf '%s\n' "$DEPLOY_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Sync compose and deploy scripts
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "mkdir -p \"${DEPLOY_PATH}/scripts\" \"${DEPLOY_PATH}/log\""
          scp -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            docker-compose.prod.yml \
            "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}/docker-compose.prod.yml"
          scp -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            scripts/deploy-release.sh \
            scripts/renew-certs.sh \
            scripts/init-letsencrypt.sh \
            scripts/install-cert-renewal.sh \
            "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}/scripts/"
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "chmod +x \
              \"${DEPLOY_PATH}/scripts/deploy-release.sh\" \
              \"${DEPLOY_PATH}/scripts/renew-certs.sh\" \
              \"${DEPLOY_PATH}/scripts/init-letsencrypt.sh\" \
              \"${DEPLOY_PATH}/scripts/install-cert-renewal.sh\""

      - name: Deploy over SSH (pull by digest)
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME != '' && secrets.GHCR_USERNAME || github.repository_owner }}
          IMAGE_OWNER: ${{ needs.publish.outputs.image_owner }}
          FRONTEND_DIGEST: ${{ needs.publish.outputs.frontend_digest }}
          NGINX_DIGEST: ${{ needs.publish.outputs.nginx_digest }}
          SMOKE_BASE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL != '' && vars.NEXT_PUBLIC_SITE_URL || secrets.NEXT_PUBLIC_SITE_URL }}
        run: |
          if [ -z "${GHCR_PULL_TOKEN}" ]; then
            echo "GHCR_PULL_TOKEN secret is required (PAT with read:packages)." >&2
            exit 1
          fi
          if [ -z "${FRONTEND_DIGEST}" ] || [ -z "${NGINX_DIGEST}" ]; then
            echo "Missing image digests from publish job." >&2
            exit 1
          fi
          if [ -z "${SMOKE_BASE_URL}" ]; then
            echo "NEXT_PUBLIC_SITE_URL (var or secret) is required for post-deploy HTTPS smoke." >&2
            exit 1
          fi
          FRONTEND_IMAGE="ghcr.io/${IMAGE_OWNER}/barber-frontend@${FRONTEND_DIGEST}"
          NGINX_IMAGE="ghcr.io/${IMAGE_OWNER}/barber-nginx@${NGINX_DIGEST}"
          TOKEN_REMOTE="${DEPLOY_PATH}/.ghcr-pull-token"
          # Token via SSH stdin → remote file (never in remote process argv / ps).
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "umask 077; cat > $(printf %q "${TOKEN_REMOTE}")" \
            <<< "${GHCR_PULL_TOKEN}"
          REMOTE_SCRIPT=$(printf %q "${DEPLOY_PATH}/scripts/deploy-release.sh")
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "env \
              DEPLOY_PATH=$(printf %q "${DEPLOY_PATH}") \
              FRONTEND_IMAGE=$(printf %q "${FRONTEND_IMAGE}") \
              NGINX_IMAGE=$(printf %q "${NGINX_IMAGE}") \
              GHCR_USERNAME=$(printf %q "${GHCR_USERNAME}") \
              GHCR_TOKEN_FILE=$(printf %q "${TOKEN_REMOTE}") \
              SMOKE_BASE_URL=$(printf %q "${SMOKE_BASE_URL}") \
              bash ${REMOTE_SCRIPT}"
