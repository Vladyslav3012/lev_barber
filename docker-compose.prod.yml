# Production: Next.js (standalone) + nginx + Let's Encrypt.
# CI deploys pre-built GHCR images by digest (FRONTEND_IMAGE / NGINX_IMAGE).
# Bootstrap / local build: docker compose -f docker-compose.prod.yml -f docker-compose.prod.build.yml up --build -d
#
# Copy .env.production.example → .env and fill real values before deploy.
# First TLS: ./scripts/init-letsencrypt.sh

services:
  frontend:
    image: ${FRONTEND_IMAGE:?Set FRONTEND_IMAGE to a GHCR image@sha256 digest}
    restart: unless-stopped
    read_only: true
    mem_limit: 512m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:uid=1000,gid=1000,mode=1777
      - /app/.next/cache:uid=1000,gid=1000,mode=0755
    environment:
      # Required: empty ${…:-} used to silently break the career form.
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?Set TELEGRAM_BOT_TOKEN in .env}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:?Set TELEGRAM_CHAT_ID in .env}
      # Optional comma-separated Origins for POST /api/career (in addition to build-time site URL).
      CAREER_ALLOWED_ORIGINS: ${CAREER_ALLOWED_ORIGINS:-}
      # Trust X-Real-IP / X-Forwarded-For from nginx (overwrites with $remote_addr).
      # Do not set this when Next is reachable without a reverse proxy.
      TRUST_PROXY: "1"
      # NEXT_PUBLIC_* is inlined at image build time (see Dockerfile ARG / CI build-arg).
      # Runtime env does not update client bundles — rebuild the frontend image to change the domain.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"require('http').get('http://127.0.0.1:3000/', (r) => { r.resume(); process.exit(r.statusCode === 200 ? 0 : 1); }).on('error', () => process.exit(1))\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  nginx:
    image: ${NGINX_IMAGE:?Set NGINX_IMAGE to a GHCR image@sha256 digest}
    restart: unless-stopped
    mem_limit: 256m
    security_opt:
      - no-new-privileges:true
    # Cap drop is limited: nginx needs NET_BIND_SERVICE for :80/:443 as non-root
    # would require image changes; still block privilege escalation.
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
    volumes:
      - certbot_conf:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
      - nginx_reload:/var/run/nginx-reload
    # service_started (not service_healthy): nginx must serve
    # /.well-known/acme-challenge even if Next is still booting or unhealthy.
    depends_on:
      frontend:
        condition: service_started
    healthcheck:
      # Host must match server_name — bare 127.0.0.1 hits default_server (444).
      # No curl -f: 502 while Next boots still means nginx is up (needed for ACME).
      test:
        [
          "CMD-SHELL",
          "curl -sS -o /dev/null --connect-timeout 2 -H \"Host: $${DOMAIN}\" http://127.0.0.1/ || exit 1",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  certbot:
    image: certbot/certbot:v5.8.0
    profiles:
      - certbot
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
      - nginx_reload:/var/run/nginx-reload

volumes:
  certbot_conf:
  certbot_www:
  nginx_reload:
