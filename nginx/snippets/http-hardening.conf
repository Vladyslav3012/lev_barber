# http-context hardening; copied to /etc/nginx/conf.d/00-hardening.conf
# by docker-entrypoint.sh.

# Log to container stdout/stderr so Docker json-file rotation applies
# (bind-mounted files were unbounded on the host).
access_log /dev/stdout;
error_log /dev/stderr warn;

server_tokens off;

# Docker embedded DNS — re-resolve frontend after compose recreates it.
# Also used for OCSP stapling lookups.
resolver 127.0.0.11 valid=10s ipv6=off;

# Shared flood guard for /api/career (survives app restarts / multiple replicas).
# App still caps successful Telegram sends in-process after validation.
limit_req_zone $binary_remote_addr zone=career:10m rate=10r/m;

# Drop requests that do not match an explicit server_name (IP scans, wrong Host).
server {
    listen 80 default_server;
    server_name _;
    return 444;
}
