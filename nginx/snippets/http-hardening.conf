# http-context hardening; copied to /etc/nginx/conf.d/00-hardening.conf
# by docker-entrypoint.sh.

access_log /var/log/levbarber/nginx-access.log;
error_log /var/log/levbarber/nginx-error.log warn;

server_tokens off;

# Docker embedded DNS — re-resolve frontend after compose recreates it.
resolver 127.0.0.11 valid=10s ipv6=off;

# Soft flood guard for career form (app still rate-limits after validation).
limit_req_zone $binary_remote_addr zone=career:10m rate=10r/m;
